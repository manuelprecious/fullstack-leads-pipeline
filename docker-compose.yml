version: '3.8'

services:
  db:
    image: postgres:15
    container_name: leads_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pipeline_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leads_backend
    restart: always
    # We remove the exposed port since only the frontend container needs to be reached from outside
    environment:
      - PORT=5000
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
    command: sh -c "npx knex migrate:latest --env development && npm start"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pipeline_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leads_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pipeline_network

volumes:
  postgres_data:

networks:
  pipeline_network:
    driver: bridge