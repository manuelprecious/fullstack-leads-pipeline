name: Leads Pipeline Continuous Integration

on:
  push:
    branches: [ feature/cicd-pipeline ]
  pull_request:
    branches: [ feature/cicd-pipeline ]
jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dynamically Generate Environment File from Secrets
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "PORT=5000" >> .env
          echo "FRONTEND_URL=http://frontend" >> .env
          
          # Pass target URL to frontend context
          echo "VITE_API_BASE_URL=http://localhost:5000" >> frontend/.env

      - name: Compile Container Architecture Layer
        run: docker compose up --build -d

      - name: Execute Pipeline Health Diagnostics Loop
        run: |
          echo "Verifying service container states..."
          docker compose ps
          
          echo "Waiting for frontend entry gateway to stabilize..."
          for i in {1..8}; do
            # Test against the explicitly exposed frontend port 80 on the host
            if curl -sI http://localhost:80 | grep -q "HTTP/"; then
              echo "Pipeline verification successful! Gateway architecture is routing traffic."
              exit 0
            fi
            echo "Routing layers pending... retrying in 5 seconds."
            sleep 5
          done
          echo "Pipeline diagnostics failed."
          docker compose logs
          exit 1

      - name: Teardown Infrastructure Services
        if: always()
        run: docker compose down --volumes