name: Leads Pipeline Continuous Integration

on:
  push:
    branches: [ main, feature/cicd-pipeline ]
  pull_request:
    branches: [ main, feature/cicd-pipeline ]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dynamically Generate Environment File from Secrets
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "PORT=5000" >> .env
          echo "FRONTEND_URL=http://frontend" >> .env
          
          # Pass target URL to frontend context
          echo "VITE_API_BASE_URL=http://localhost:5000" >> frontend/.env

      - name: Compile Container Architecture Layer
        run: docker compose up --build -d

      - name: Execute Pipeline Health Diagnostics Loop
        run: |
          echo "Waiting for backend API gateway routing layers to stabilize..."
          for i in {1..6}; do
            # Use internal Node.js script to execute HTTP request inside the container network bridge
            if docker compose exec -T leads_backend node -e "
              const http = require('http');
              http.get('http://localhost:5000/health', (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200 && data.includes('\"status\":\"healthy\"')) {
                    process.exit(0);
                  }
                  process.exit(1);
                });
              }).on('error', () => process.exit(1));
            "; then
              echo "Pipeline verification successful! Secure database pool connected."
              exit 0
            fi
            echo "Health status pending... retrying in 5 seconds."
            sleep 5
          done
          echo "Pipeline diagnostics failed."
          docker compose logs
          exit 1

      - name: Teardown Infrastructure Services
        if: always()
        run: docker compose down --volumes